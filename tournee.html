<title>Tournée</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout : une colonne façon table de bar, cartes crème sur fond aubergine, accent laiton (bière). Look sombre assumé, un seul thème. */
:root{
  --bg:#1b1321;
  --surface:#271b2f;
  --surface-2:#33243d;
  --line:#463554;
  --fg:#f4eadc;
  --muted:#b9a7bd;
  --accent:#f0b13c;
  --accent-ink:#2a1a06;
  --card:#f7efe2;
  --card-ink:#1e1622;
  --card-red:#c22a3e;
  --good:#74d6a0;
  --bad:#ff7a7a;
  --purple:#9b5de5;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  --cw:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Accueil ---------- */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.brand h1{font:400 clamp(44px,13vw,64px)/.9 var(--display);letter-spacing:.01em;color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.fan{position:relative;width:86px;height:70px;flex:none}
.fan .card{position:absolute;bottom:0;left:22px;--cw:44px;transform-origin:50% 120%}
.fan .card:nth-child(1){transform:rotate(-18deg)}
.fan .card:nth-child(2){transform:rotate(0)}
.fan .card:nth-child(3){transform:rotate(18deg)}

.label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-weight:600}
.chip button{border:0;background:transparent;color:var(--muted);width:24px;height:24px;border-radius:50%;line-height:1;font-size:16px}
.chip button:hover{background:var(--line);color:var(--fg)}
.chip.pick{padding:7px 14px;border-radius:999px}
.chip.pick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 12px;font:inherit}
.add input::placeholder{color:var(--muted)}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:16px 18px;font-size:18px;width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(1px)}

.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.game:hover{border-color:var(--accent)}
.game .gname{font:400 22px/1 var(--display);color:var(--fg)}
.game .gdesc{font-size:13.5px;color:var(--muted);line-height:1.35}
.game .gmeta{margin-top:auto;font-size:12px;font-weight:600;color:var(--accent)}
.game .suit{font-size:22px;line-height:1}
.suit.r{color:var(--bad)}

.foot{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5;padding-top:8px;border-top:1px solid var(--line)}

/* ---------- En-tête de jeu ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h2{font:400 clamp(20px,6.4vw,26px)/1 var(--display);color:var(--accent);text-align:center;min-width:0}
.iconbtn{white-space:nowrap;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
details.rules summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.rules summary::after{content:"+";color:var(--accent);font-weight:800}
details.rules[open] summary::after{content:"–"}
details.rules ul,details.rules ol{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:5px}
details.rules b{color:var(--fg)}

.turn{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.turn .who{font:400 clamp(28px,9vw,40px)/1.05 var(--display)}
.turn .sub{color:var(--muted);font-size:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.verdict{font-weight:800;font-size:18px;text-align:center}
.verdict.ok{color:var(--good)}
.verdict.ko{color:var(--bad)}
.center{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.choices .btn{padding:16px 10px;font-size:17px}
.btn.red{background:var(--card-red);border-color:var(--card-red);color:#fff}
.btn.black{background:#0d0a10;border-color:#4a3c55;color:#fff}
.btn.purple{background:linear-gradient(135deg,var(--card-red) 0 50%,#0d0a10 50% 100%);border-color:var(--purple);color:#fff}

/* ---------- Cartes ---------- */
.card{position:relative;width:var(--cw);aspect-ratio:5/7;max-width:100%;border-radius:calc(var(--cw)*.12);background:var(--card);color:var(--card-ink);box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35);flex:none;font-family:var(--body);font-weight:800;user-select:none}
.card.red{color:var(--card-red)}
.card .tl,.card .br{position:absolute;font-size:calc(var(--cw)*.2);line-height:1;text-align:center}
.card .tl{top:7%;left:9%}
.card .br{bottom:7%;right:9%;transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.5)}
.card.back{background:
  repeating-linear-gradient(45deg,transparent 0 5px,rgba(240,177,60,.28) 5px 7px),
  repeating-linear-gradient(-45deg,transparent 0 5px,rgba(240,177,60,.28) 5px 7px),
  #5a2340;border:3px solid var(--card)}
.card.empty{background:transparent;border:2px dashed var(--line);box-shadow:none}
.card.used{opacity:.3;filter:grayscale(.6)}
.card.hl{outline:3px solid var(--accent);outline-offset:3px}
.card.xl{--cw:min(140px,34vw)}
.card.lg{--cw:96px}
.card.sm{--cw:40px}
.card.memo{--cw:min(72px,17vw)}
.card.deal{animation:deal .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes deal{from{transform:translateY(-18px) rotate(-8deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.deal{animation:none}}

/* Palmier : anneau de cartes autour du verre */
.palm{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:0 auto}
.palm .ring{position:absolute;inset:0}
.palm .ring .card{position:absolute;left:50%;top:50%;--cw:26px;margin:calc(var(--cw)*-.7) 0 0 calc(var(--cw)*-.5);box-shadow:0 1px 3px rgba(0,0,0,.4);border-width:2px}
.glass{position:absolute;left:50%;top:50%;width:72px;height:92px;transform:translate(-50%,-50%);border:3px solid var(--fg);border-top:0;border-radius:4px 4px 18px 18px;overflow:hidden;background:rgba(255,255,255,.04)}
.glass .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--accent),#c47d14);transition:height .5s}
.glass .foam{position:absolute;left:0;right:0;height:8px;background:var(--card);opacity:.9}
.kings{text-align:center;color:var(--muted);font-size:14px}
.rule-title{font:400 24px/1.1 var(--display);text-align:center;color:var(--accent)}
.rule-text{text-align:center;font-size:16px}

/* Rivière */
.hand{display:flex;gap:6px;flex-wrap:wrap}
.river{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;align-items:center;justify-items:center}
.river .rl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);justify-self:start}
.river .num{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.river .card{--cw:min(52px,13vw)}
.hands{display:flex;flex-direction:column;gap:8px}
.hands .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.hands .hrow .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hands .card{--cw:30px}
.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;text-align:center}

/* Purple */
.pile{display:flex;align-items:center;justify-content:center;gap:14px}
.stack{position:relative;width:64px;height:90px}
.stack .card{position:absolute;left:0;top:0;--cw:64px}
.count{font:400 40px/1 var(--display);font-variant-numeric:tabular-nums}
.streak{display:flex;gap:6px;justify-content:center}
.streak i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.streak i.on{background:var(--good)}

/* Autoroute */
.road{position:relative;background:#2a2a30;border-radius:var(--r);padding:16px 10px;overflow-x:auto}
.road::before{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:3px dashed rgba(244,234,220,.35)}
.road .lane{position:relative;display:flex;gap:6px;justify-content:space-between}
.road .card{--cw:min(50px,12.5vw)}
.road .slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.road .km{font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:flex;justify-content:center;gap:18px;color:var(--muted);font-size:14px}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Barbu : pioche */
.deckpile{position:relative;width:86px;height:118px;margin:0 auto}
.deckpile .card{position:absolute;left:0;top:0;--cw:80px}

/* Pyramide */
.pyr{display:flex;flex-direction:column;gap:6px;align-items:center}
.pyr .prow{display:flex;gap:6px;align-items:center}
.pyr .card{--cw:min(46px,10.5vw)}
.pyr .tag{width:28px;font-size:12px;font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pyr .tag.on{color:var(--accent)}
.hrow .peek{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}

/* Ascenseur */
.lift{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start}
.shaft{display:flex;flex-direction:column;gap:3px;background:#2a2a30;border-radius:12px;padding:6px}
.floor{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;font-weight:800;font-size:15px}
.floor .seen{display:flex;gap:2px}
.floor .seen i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.floor .seen i.on{background:var(--muted)}
.floor.guess{background:var(--bad);color:#1a0b0b;border-color:var(--bad)}
.floor.hit{background:var(--good);color:#0b1a12;border-color:var(--good)}
.floor:disabled{opacity:.35;cursor:not-allowed}
.hint{font:400 26px/1.1 var(--display);text-align:center;color:var(--accent)}
@media (max-width:360px){.lift{grid-template-columns:78px minmax(0,1fr)}}

/* Éditeur de règles */
.edit{display:flex;flex-direction:column;gap:10px}
.erow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.erow .fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.erow input,.erow textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit}
.erow input.t{font-weight:700}
.erow textarea{resize:vertical;min-height:60px;font-size:14.5px}
.erow .s{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.erow .s input{width:64px}
.erow .card{--cw:38px}
.tabs{display:flex;gap:8px}
[hidden]{display:none!important}

/* Compteur */
.sheet{position:fixed;inset:0;background:rgba(10,6,12,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .inner{width:100%;max-width:540px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:85%;overflow:auto}
.tally{display:flex;flex-direction:column;gap:6px}
.tally .t{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;background:var(--surface-2);padding:8px 10px;border-radius:10px}
.tally .t .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tally .t .v{font:400 22px/1 var(--display);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.tally .t button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.bar{height:4px;border-radius:2px;background:var(--accent);grid-column:1/-1}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:800;padding:10px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:20;max-width:calc(100% - 32px);text-align:center}
.warn{color:var(--bad);font-weight:600;text-align:center}
.muted{color:var(--muted)}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
// ---------- Utilitaires cartes ----------
const SUITS = [
  { s: '♠', red: false, n: 'pique' },
  { s: '♥', red: true,  n: 'cœur' },
  { s: '♦', red: true,  n: 'carreau' },
  { s: '♣', red: false, n: 'trèfle' }
];
const LABEL = v => ({ 1: 'A', 11: 'V', 12: 'D', 13: 'R' })[v] || String(v);
const NAME = v => ({ 1: 'As', 11: 'Valet', 12: 'Dame', 13: 'Roi' })[v] || String(v);
const rank = c => (c.v === 1 ? 14 : c.v); // l'As est la carte la plus forte

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function newDeck() {
  const d = [];
  for (const su of SUITS) for (let v = 1; v <= 13; v++) d.push({ v, s: su.s, red: su.red, sn: su.n });
  return shuffle(d);
}
function draw(g) {
  if (!g.deck.length) g.deck = newDeck();
  return g.deck.pop();
}
function cardHTML(c, cls = '') {
  if (c === 'back') return `<div class="card back ${cls}" aria-label="carte face cachée"></div>`;
  if (!c) return `<div class="card empty ${cls}" aria-hidden="true"></div>`;
  const l = LABEL(c.v);
  return `<div class="card ${c.red ? 'red' : ''} ${cls}" role="img" aria-label="${NAME(c.v)} de ${c.sn}">
    <span class="tl">${l}<br>${c.s}</span><span class="pip">${c.s}</span><span class="br">${l}<br>${c.s}</span></div>`;
}
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;

// ---------- État ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('tournee:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tournee:' + k, JSON.stringify(v)); } catch {} }
};
const S = {
  players: store.get('players', ['Léa', 'Hugo', 'Inès', 'Tom']),
  sips: store.get('sips', {}),
  screen: 'home',
  g: null,
  sheet: false
};
function save() { store.set('players', S.players); store.set('sips', S.sips); }
function drink(name, n) {
  S.sips[name] = (S.sips[name] || 0) + n;
  save();
}
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200);
}

// ---------- Règles ----------
const DEFAULT_RULES = {};
DEFAULT_RULES.palmier = {
  1:  { t: 'Cascade', d: 'Tout le monde boit en même temps. Personne ne s’arrête avant celui qui a tiré la carte.' },
  2:  { t: 'Tu donnes 2', d: 'Distribue 2 gorgées à qui tu veux.' },
  3:  { t: 'Tu bois 3', d: 'Bois 3 gorgées.', sips: 3 },
  4:  { t: 'Les voisins', d: 'Tes voisins de gauche et de droite boivent une gorgée.' },
  5:  { t: 'J’ai jamais', d: 'Annonce un « Je n’ai jamais… ». Ceux qui l’ont déjà fait boivent.' },
  6:  { t: 'Doigt sur le nez', d: 'Le dernier à poser le doigt sur son nez boit 2 gorgées.' },
  7:  { t: 'Le 7 Buzz', d: 'On compte à tour de rôle. Multiple de 7 ou nombre contenant un 7 : on dit « Buzz ». Celui qui se trompe boit.' },
  8:  { t: 'Thème', d: 'Choisis un thème (marques de bière, capitales…). Chacun cite un mot, le premier qui sèche boit.' },
  9:  { t: 'Rimes', d: 'Dis un mot. Chacun trouve une rime, le premier qui sèche boit.' },
  10: { t: 'Nouvelle règle', d: 'Invente une règle valable jusqu’à la fin de la partie. Qui l’oublie boit.' },
  11: { t: 'Maître du pouce', d: 'Jusqu’au prochain Valet, quand tu poses ton pouce sur la table, le dernier à t’imiter boit.' },
  12: { t: 'Maître des questions', d: 'Jusqu’à la prochaine Dame, quiconque répond à une de tes questions boit.' },
  13: { t: 'Roi', d: 'Verse un peu de ton verre dans le verre central du palmier.' }
};
DEFAULT_RULES.barbu = {
  1:  { t: 'Tu bois 1', d: 'Bois une gorgée.', sips: 1 },
  2:  { t: 'Tu donnes 2', d: 'Distribue 2 gorgées à qui tu veux.' },
  3:  { t: 'Tu bois 3', d: 'Bois 3 gorgées.', sips: 3 },
  4:  { t: 'Tu donnes 4', d: 'Distribue 4 gorgées, en une fois ou en plusieurs.' },
  5:  { t: 'Santé', d: 'Tout le monde boit une gorgée.' },
  6:  { t: 'Thème', d: 'Choisis un thème. Chacun cite un mot, le premier qui sèche boit.' },
  7:  { t: 'Le Barbu', d: 'Le dernier à se caresser le menton comme un barbu boit 2 gorgées.' },
  8:  { t: 'Dans ma valise', d: '« Dans ma valise, je mets… » Chacun répète la liste et ajoute un objet. Le premier qui se trompe boit.' },
  9:  { t: 'Rimes', d: 'Dis un mot. Chacun trouve une rime, le premier qui sèche boit.' },
  10: { t: 'J’ai jamais', d: 'Annonce un « Je n’ai jamais… ». Ceux qui l’ont déjà fait boivent.' },
  11: { t: 'À gauche', d: 'Ton voisin de gauche boit 2 gorgées.' },
  12: { t: 'À droite', d: 'Ton voisin de droite boit 2 gorgées.' },
  13: { t: 'Nouvelle règle', d: 'Invente une règle valable jusqu’à la fin de la partie. Qui l’oublie boit.' }
};
const clone = o => JSON.parse(JSON.stringify(o));
S.rules = {
  palmier: store.get('rules:palmier', null) || clone(DEFAULT_RULES.palmier),
  barbu: store.get('rules:barbu', null) || clone(DEFAULT_RULES.barbu)
};
function rulesList(id) {
  return Object.entries(S.rules[id]).map(([v, r]) =>
    `<b>${NAME(+v)} · ${esc(r.t)}</b> : ${esc(r.d)}${r.sips ? ` <span class="muted">(compté : ${plural(r.sips, 'gorgée')})</span>` : ''}`);
}
function rulesBlock(id) {
  return `<details class="rules"><summary>Règles</summary><ul>${rulesList(id).map(i => `<li>${i}</li>`).join('')}</ul>
    <p style="margin:0 0 14px"><button class="btn" data-act="editor" data-arg="${id}">Modifier les règles</button></p></details>`;
}

const GAMES = [
  { id: 'palmier',   name: 'Palmier',   suit: '♣', red: false, desc: 'Les cartes en cercle autour du verre. Chaque carte a sa règle.', meta: '3 joueurs et +' },
  { id: 'riviere',   name: 'Rivière',   suit: '♥', red: true,  desc: '4 questions pour faire sa main, puis la rivière : bois ou donne.', meta: '2 à 10 joueurs' },
  { id: 'purple',    name: 'Purple',    suit: '♦', red: true,  desc: 'Rouge, noir ou purple ? La pile grossit tant que tu as raison.', meta: '2 joueurs et +' },
  { id: 'autoroute', name: 'Autoroute', suit: '♠', red: false, desc: 'Plus ou moins, carte après carte. Une erreur et on repart du péage.', meta: '1 pilote' },
  { id: 'pyramide',  name: 'Pyramide',  suit: '♠', red: false, desc: '15 cartes en pyramide. Tu as la carte ? Distribue. Tu bluffes ? Gare à toi.', meta: '2 à 9 joueurs' },
  { id: 'ascenseur', name: 'Ascenseur', suit: '♥', red: true,  desc: 'Devine l’étage de la carte du donneur. Ça monte, ça descend, ça boit.', meta: '2 joueurs et +' },
  { id: 'barbu',     name: 'Barbu',     suit: '♣', red: false, desc: 'On pioche à tour de rôle, chaque carte impose son action.', meta: '3 joueurs et +' }
];

// ---------- Initialisation des jeux ----------
const INIT = {
  palmier: () => {
    const deck = newDeck();
    deck.forEach((c, i) => (c.pos = i)); // place fixe de chaque carte dans le cercle
    return { deck, last: null, kings: 0, turn: 0, by: null };
  },
  riviere: () => {
    const g = { phase: 'deal', deck: newDeck(), hands: {}, round: 0, pi: 0, res: null, river: [], k: -1, lines: [] };
    S.players.forEach(p => (g.hands[p] = []));
    return g;
  },
  purple: () => ({ deck: newDeck(), pile: 0, turn: 0, streak: 0, last: null }),
  autoroute: (driver) => {
    const g = { deck: newDeck(), len: 6, driver: driver || S.players[0], tries: 1, total: 0, crash: null, done: false };
    g.slots = Array(g.len).fill(null); g.slots[0] = draw(g); g.pos = 0;
    return g;
  },
  barbu: () => ({ deck: newDeck(), last: null, turn: 0, by: null }),
  pyramide: () => {
    const g = { phase: 'memo', mi: 0, showing: false, left: 0, deck: newDeck(), hands: {}, cards: [], k: -1, check: false };
    S.players.forEach(p => (g.hands[p] = [draw(g), draw(g), draw(g), draw(g)]));
    g.cards = Array.from({ length: 15 }, () => draw(g)); // ordre de retournement : rangée du bas (1 gorgée) vers le sommet (5)
    return g;
  },
  ascenseur: () => {
    const g = { deck: newDeck(), seen: {}, dealer: 0, player: 1, fails: 0, guess: null, res: null };
    g.cur = draw(g);
    return g;
  }
};
const MEMO_SECONDS = 10; // temps pour mémoriser sa main à la Pyramide
let memoTimer;
const PYR_ROWS =[[0, 5], [5, 9], [9, 12], [12, 14], [14, 15]]; // [début, fin) par rangée, du bas vers le haut

// ---------- Écrans ----------
function header(title) {
  return `<div class="top">
    <button class="iconbtn" data-act="home" aria-label="Retour aux jeux">← Jeux</button>
    <h2>${title}</h2>
    <button class="iconbtn" data-act="sheet">Compteur</button>
  </div>`;
}
function rules(items, ordered) {
  const tag = ordered ? 'ol' : 'ul';
  return `<details class="rules"><summary>Règles</summary><${tag}>${items.map(i => `<li>${i}</li>`).join('')}</${tag}></details>`;
}

const SCREENS = {
  home() {
    return `
    <div class="brand">
      <div><h1>Tournée</h1><p>Les jeux de cartes de soirée, sans paquet ni arbitre.</p></div>
      <div class="fan" aria-hidden="true">${cardHTML({ v: 1, s: '♠', red: false, sn: 'pique' })}${cardHTML({ v: 13, s: '♥', red: true, sn: 'cœur' })}${cardHTML({ v: 7, s: '♦', red: true, sn: 'carreau' })}</div>
    </div>

    <div class="section">

      <form class="add" id="addForm">

  palmier() {
    const g = S.g, p = S.players;
    const total = g.deck.length;
    const ring = g.deck.map(c => {
      const a = (c.pos / 52) * 360;
      return `<div class="card back" style="transform:rotate(${a}deg) translateY(calc(-1 * min(120px, 33vw)))"></div>`;
    }).join('');
    const fill = Math.min(g.kings, 4) * 22;

      else if (g.last.v === 13) d += ` (Rois : ${g.kings}/4)`;
      result = `<div class="center">${cardHTML(g.last, 'lg deal')}</div>

  riviere() {
    const g = S.g;
    const R = rules([
      '<b>Phase 1, la main</b> : chaque joueur répond à ses 4 questions d’affilée, puis on passe au suivant. Bonne réponse : rien. Mauvaise : tu bois les gorgées de la question.',
      '<b>Question 1</b> : rouge ou noir ? (1 gorgée) · <b>Question 2</b> : plus ou moins que ta 1<sup>re</sup> carte ? (2) · <b>Question 3</b> : entre tes deux cartes ou à l’extérieur ? (3) · <b>Question 4</b> : quelle couleur ? (4)',
      'Une égalité compte comme une erreur. L’As est la carte la plus forte.',
      '<b>Phase 2, la rivière</b> : 10 cartes sur deux rangées, « Bois » et « Donne », de 1 à 5 gorgées. Si une carte retournée a la même valeur qu’une carte de ta main, tu bois ou tu donnes, et ta carte est défaussée.',
      'À la fin, celui à qui il reste le plus de cartes prend l’autoroute.'
    ]);
    if (S.players.length < 2 || S.players.length > 10) {
      return `${header('Rivière')}${R}<p class="warn">La Rivière se joue de 2 à 10 joueurs.</p>`;
    }
    if (g.phase === 'deal') {
      const p = S.players[g.pi], hand = g.hands[p];
      const Q = [
        { q: 'Rouge ou noir ?', opts: [['rouge', 'Rouge', 'red'], ['noir', 'Noir', 'black']] },
        { q: `Plus ou moins que ton ${hand[0] ? NAME(hand[0].v) + ' ' + hand[0].s : ''} ?`, opts: [['plus', 'Plus ▲', ''], ['moins', 'Moins ▼', '']] },
        { q: 'Entre tes deux cartes ou à l’extérieur ?', opts: [['in', 'Intérieur', ''], ['out', 'Extérieur', '']] },
        { q: 'Quelle couleur ?', opts: SUITS.map(s => [s.s, `${s.s} ${s.n[0].toUpperCase() + s.n.slice(1)}`, s.red ? 'red' : 'black']) }
      ][g.round];
      const slots = [0, 1, 2, 3].map(i => cardHTML(hand[i] || null, `sm ${g.res && i === g.round ? 'deal hl' : ''}`)).join('');
      return `${header('Rivière')}${R}
        <div class="turn"><span class="sub">Question ${g.round + 1}/4 · ${plural(g.round + 1, 'gorgée')} si tu te trompes</span><span class="who">${esc(p)}</span></div>
        <div class="panel">
          <div class="center">${slots}</div>
          ${g.res ? `<div class="verdict ${g.res.ok ? 'ok' : 'ko'}">${g.res.ok ? `Bien vu ! ${esc(p)} ne boit pas.` : `Perdu… ${esc(p)} boit ${plural(g.round + 1, 'gorgée')}.`}</div>
                    <button class="btn primary big" data-act="rivNext">${g.round < 3 ? 'Question suivante' : g.pi === S.players.length - 1 ? 'Ouvrir la rivière' : 'Joueur suivant'}</button>`
                 : `<div class="verdict">${Q.q}</div><div class="choices">${Q.opts.map(([v, l, c]) => `<button class="btn ${c}" data-act="rivAnswer" data-arg="${v}">${l}</button>`).join('')}</div>`}
        </div>
        ${handsHTML(g)}`;
    }
    // Phase rivière
    const cells = (row) => [0, 1, 2, 3, 4].map(col => {
      const idx = col * 2 + row;
      return cardHTML(idx <= g.k ? g.river[idx] : 'back', idx === g.k ? 'deal hl' : '');
    }).join('');
    const done = g.k >= 9;
    let end = '';
    if (done) {
      const left = S.players.map(p => [p, g.hands[p].filter(c => !c.used).length]);
      const max = Math.max(...left.map(x => x[1]));
      const losers = left.filter(x => x[1] === max).map(x => x[0]);
      end = `<div class="verdict">${losers.length > 1 ? losers.slice(0, -1).map(esc).join(', ') + ' et ' + esc(losers.at(-1)) : esc(losers[0])} ${losers.length > 1 ? 'finissent' : 'finit'} avec ${plural(max, 'carte')}. Direction l’autoroute !</div>
        <div class="choices">${losers.map(l => `<button class="btn primary" data-act="toRoad" data-arg="${esc(l)}">Autoroute pour ${esc(l)}</button>`).join('')}</div>
        <button class="btn ghost" data-act="restart">Rejouer une rivière</button>`;
    }
    return `${header('Rivière')}${R}
      <div class="panel">
        <div class="river">
          <span></span>${[1, 2, 3, 4, 5].map(n => `<span class="num">${n}</span>`).join('')}
          <span class="rl">Bois</span>${cells(0)}
          <span class="rl">Donne</span>${cells(1)}
        </div>
        ${g.k >= 0 ? `<ul class="lines">${g.lines.map(l => `<li>${l}</li>`).join('')}</ul>` : '<p class="muted" style="margin:0;text-align:center">Retourne les cartes une par une, de gauche à droite.</p>'}
        ${done ? end : `<button class="btn primary big" data-act="rivFlip">Retourner la carte ${g.k + 2}/10</button>`}
      </div>
      ${handsHTML(g)}`;
  },

    const stack = Array.from({ length: Math.min(g.pile, 5) }, (_, i) => `<div class="card back" style="transform:translate(${i * 3}px,${-i * 3}px) rotate(${(i % 2 ? 1 : -1) * i * 2}deg)"></div>`).join('') || cardHTML(null);
    let res = '<p class="muted" style="margin:0;text-align:center">Rouge ou noir pour une carte. Purple : les deux prochaines cartes sont une rouge et une noire.</p>';
    if (g.last) {
      const L = g.last;
      res = `<div class="center">${L.cards.map(c => cardHTML(c, 'lg deal')).join('')}</div>
        <div class="verdict ${L.ok ? 'ok' : 'ko'}">${L.ok ? `Bien vu ${esc(L.who)} !` : `Raté ! ${esc(L.who)} boit ${plural(L.sips, 'gorgée')}.`}</div>`;
    }
    const canPass = g.streak >= 3;
    return `${header('Purple')}
      ${rules([
        'Annonce <b>Rouge</b> ou <b>Noir</b> pour la prochaine carte, ou <b>Purple</b> si les deux suivantes sont une rouge et une noire.',
        'Bonne réponse : les cartes vont sur la pile et tu rejoues.',
        'Après 3 bonnes réponses d’affilée, tu peux passer la main. La pile reste pour le suivant.',
        'Mauvaise réponse : tu bois autant de gorgées que de cartes sur la pile (cartes tirées comprises), la pile repart à zéro et c’est au suivant.'
      ])}
      <div class="turn"><span class="sub">À toi de deviner</span><span class="who">${esc(p)}</span></div>
      <div class="streak" aria-label="${g.streak} bonne(s) réponse(s) d’affilée">${[0, 1, 2].map(i => `<i class="${g.streak > i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="pile"><div class="stack">${stack}</div><div><div class="count">${g.pile}</div><div class="muted">carte${g.pile > 1 ? 's' : ''} sur la pile</div></div></div>
      <div class="panel">${res}</div>
      <div class="choices">
        <button class="btn red" data-act="purpleGuess" data-arg="rouge">Rouge</button>
        <button class="btn black" data-act="purpleGuess" data-arg="noir">Noir</button>
        <button class="btn purple" data-act="purpleGuess" data-arg="purple">Purple</button>
      </div>
      <button class="btn big" data-act="purplePass" ${canPass ? '' : 'disabled'}>${canPass ? 'Passer la main' : `Passer la main dans ${3 - g.streak}`}</button>`;
  },

  autoroute() {
    const g = S.g;
    const slots = g.slots.map((c, i) => {
      let cls = i === g.pos && !g.crash ? 'hl' : '';
      if (g.crash && i === g.pos + 1) return `<div class="slot">${cardHTML(g.crash.card, 'deal hl')}<span class="km" style="color:var(--bad)">Crash</span></div>`;
      if (i === g.pos && c) cls += ' deal';
      return `<div class="slot">${cardHTML(c || 'back', cls)}<span class="km">${i === 0 ? 'Départ' : i === g.len - 1 ? 'Arrivée' : `${i}`}</span></div>`;
    }).join('');
    let msg, actions;
    if (g.done) {
      msg = `<div class="verdict ok">${esc(g.driver)} est arrivé·e au bout en ${plural(g.tries, 'essai')} et ${plural(g.total, 'gorgée')}.</div>`;
      actions = `<button class="btn primary big" data-act="roadNew">Nouveau trajet</button>`;
    } else if (g.crash) {
      msg = `<div class="verdict ko">${g.crash.tie ? 'Égalité, ça compte comme une erreur.' : 'Raté !'} ${esc(g.driver)} boit ${plural(g.crash.sips, 'gorgée')} et repart du départ.</div>`;
      actions = `<button class="btn primary big" data-act="roadRetry">Repartir</button>`;
    } else {
      const cur = g.slots[g.pos];
      msg = `<div class="verdict">La prochaine carte est-elle plus forte ou plus faible que ${NAME(cur.v)} ${cur.s} ?</div>
        <p class="muted" style="margin:0;text-align:center">Une erreur ici coûte ${plural(g.pos + 1, 'gorgée')}.</p>`;
      actions = `<div class="choices"><button class="btn primary" data-act="roadGuess" data-arg="plus">Plus ▲</button><button class="btn primary" data-act="roadGuess" data-arg="moins">Moins ▼</button></div>`;
    }
    return `${header('Autoroute')}
      ${rules([
        'Six cartes en ligne. La première est retournée, c’est le départ.',
        'Devine si la suivante est <b>plus forte</b> ou <b>plus faible</b>. L’As est la plus forte, une égalité compte comme une erreur.',
        'Une erreur sur la carte n°N : tu bois N gorgées et tu repars du départ avec de nouvelles cartes.',
        'Tu sors de l’autoroute quand tu as passé les 5 cartes.'
      ])}
      <div class="section"><span class="label">Pilote</span>
        <div class="chips">${S.players.map(p => `<button class="chip pick" data-act="roadDriver" data-arg="${esc(p)}" aria-pressed="${p === g.driver}">${esc(p)}</button>`).join('')}</div></div>
      <div class="road"><div class="lane">${slots}</div></div>
      <div class="stats"><span>Essai <b>${g.tries}</b></span><span>Gorgées <b>${g.total}</b></span><span>Carte <b>${Math.min(g.pos + 1, g.len - 1)}</b>/${g.len - 1}</span></div>
      <div class="panel">${msg}${actions}</div>`;
  }
,

  barbu() {
    const g = S.g, p = S.players, total = g.deck.length, over = total === 0;
    const pile = over ? cardHTML(null) : Array.from({ length: Math.min(4, Math.ceil(total / 13)) }, (_, i) =>
      `<div class="card back" style="transform:translate(${i * 2}px,${-i * 2}px)"></div>`).join('');
    let result = '<p class="rule-text muted" style="margin:0">Chacun pioche à son tour et applique l’action de la carte.</p>';
    if (g.last) {
      const r = S.rules.barbu[g.last.v];
      result = `<div class="center">${cardHTML(g.last, 'lg deal')}</div>
        <div class="rule-title">${esc(r.t)}</div><p class="rule-text" style="margin:0">${esc(r.d)}</p>`;
    }
    return `${header('Barbu')}
      ${rulesBlock('barbu')}
      <div class="turn"><span class="sub">${g.last ? `${esc(g.by)} a pioché · au tour de` : 'Au tour de'}</span><span class="who">${over ? 'Fin du paquet' : esc(p[g.turn % p.length])}</span></div>
      <div class="deckpile" aria-label="${plural(total, 'carte')} dans la pioche">${pile}</div>
      <div class="kings">${plural(total, 'carte')} dans la pioche</div>
      <div class="panel">${result}</div>
      ${over ? `<button class="btn primary big" data-act="restart">Nouvelle partie</button>`
             : `<button class="btn primary big" data-act="barbuDraw">Piocher</button>`}`;
  },

  pyramide() {
    const g = S.g;
    const R = rules([
      'Chaque joueur reçoit 4 cartes. On se passe le téléphone : chacun voit sa main une seule fois, ' + MEMO_SECONDS + ' secondes, puis elle est cachée jusqu’à la fin. Retiens-la bien.',
      'La pyramide se retourne carte par carte, de la rangée du bas (1 gorgée) jusqu’au sommet (5 gorgées).',
      'Si tu penses avoir une carte de même valeur, annonce-le et distribue les gorgées de la rangée. Tu peux bluffer.',
      'Quelqu’un te conteste ? « Qui l’a vraiment » tranche : le menteur boit le double, sinon c’est le contestataire qui boit le double. Celui qui s’est trompé de bonne foi boit aussi.',
      'À la fin de la pyramide, toutes les mains sont dévoilées.'
    ]);
    if (S.players.length > 9) return `${header('Pyramide')}${R}<p class="warn">La Pyramide se joue de 2 à 9 joueurs.</p>`;
    if (g.phase === 'memo') {
      const p = S.players[g.mi], last = g.mi === S.players.length - 1;
      const body = g.showing
        ? `<div class="center">${g.hands[p].map(c => cardHTML(c, 'memo deal')).join('')}</div>
           <div class="hint" id="memoLeft" aria-live="polite">${g.left} s</div>
           <button class="btn primary big" data-act="pyrHide">J’ai retenu, cacher mes cartes</button>`
        : `<div class="center">${[0, 1, 2, 3].map(() => cardHTML('back', 'memo')).join('')}</div>
           <p style="margin:0;text-align:center">Passe le téléphone à <b>${esc(p)}</b>. Les autres, on regarde ailleurs.</p>
           <button class="btn primary big" data-act="pyrShow">Je suis ${esc(p)}, montrer mes cartes</button>`;
      return `${header('Pyramide')}${R}
        <div class="turn"><span class="sub">Mémorisation · joueur ${g.mi + 1}/${S.players.length}${last ? ' · dernier' : ''}</span><span class="who">${esc(p)}</span></div>
        <div class="panel">${body}</div>
        <p class="muted" style="margin:0;text-align:center;font-size:14px">Tes cartes ne s’afficheront plus avant la fin de la partie.</p>`;
    }
    const rowsHTML = PYR_ROWS.map(([a, b], r) => {
      const cells = [];
      for (let i = a; i < b; i++) cells.push(cardHTML(i <= g.k ? g.cards[i] : 'back', i === g.k ? 'deal hl' : ''));
      const on = g.k >= a && g.k < b;
      return `<div class="prow"><span class="tag ${on ? 'on' : ''}" title="${plural(r + 1, 'gorgée')}">×${r + 1}</span>${cells.join('')}<span class="tag" aria-hidden="true"></span></div>`;
    }).reverse().join('');
    let info = '<p class="muted" style="margin:0;text-align:center">Tout le monde a mémorisé sa main. Retourne la première carte.</p>';
    if (g.k >= 0) {
      const c = g.cards[g.k], sips = PYR_ROWS.findIndex(([a, b]) => g.k >= a && g.k < b) + 1;
      const holders = S.players.filter(p => g.hands[p].some(h => h.v === c.v));
      info = `<div class="verdict">${NAME(c.v)} ${c.s} : ceux qui ont un ${NAME(c.v)} distribuent ${plural(sips, 'gorgée')}.</div>
        ${g.check
          ? `<p style="margin:0;text-align:center">${holders.length ? `Ont vraiment un ${NAME(c.v)} : <b>${holders.map(esc).join(', ')}</b>.` : `Personne n’a de ${NAME(c.v)}. Les menteurs boivent ${plural(sips * 2, 'gorgée')}.`}</p>`
          : `<button class="btn" data-act="pyrCheck">Bluff contesté ? Voir qui l’a vraiment</button>`}`;
    }
    const done = g.k >= 14;
    return `${header('Pyramide')}${R}
      <div class="panel">
        <div class="pyr">${rowsHTML}</div>
        ${info}
        ${done ? `<div class="verdict ok">Pyramide terminée.</div><button class="btn primary big" data-act="restart">Nouvelle pyramide</button>`
               : `<button class="btn primary big" data-act="pyrFlip">Retourner la carte ${g.k + 2}/15</button>`}
      </div>
      <div class="section"><span class="label">${done ? 'Les mains dévoilées' : 'Les mains, cachées jusqu’à la fin'}</span><div class="hands">${S.players.map(p => `
        <div class="hrow"><span class="n">${esc(p)}</span>
          <div class="hand">${g.hands[p].map(c => cardHTML(done ? c : 'back')).join('')}</div></div>`).join('')}</div></div>`;
  },

  ascenseur() {
    const g = S.g, P = S.players;
    const dealer = P[g.dealer % P.length], player = P[g.player % P.length];
    const actual = rank(g.cur);
    const floors = [];
    for (let r = 14; r >= 2; r--) {
      const v = r === 14 ? 1 : r;
      let cls = '', dis = !!g.res;
      if (g.res && r === actual) cls = 'hit';
      else if (g.guess === r) cls = 'guess';
      if (!g.res && g.guess !== null) dis = g.guess === r || (actual > g.guess ? r < g.guess : r > g.guess);
      const seen = g.seen[r] || 0;
      floors.push(`<button class="floor ${cls}" data-act="liftGuess" data-arg="${r}" ${dis ? 'disabled' : ''} aria-label="Étage ${NAME(v)}">
        <span>${LABEL(v)}</span><span class="seen" aria-hidden="true">${[0, 1, 2, 3].map(i => `<i class="${i < seen ? 'on' : ''}"></i>`).join('')}</span></button>`);
    }
    let panel;
    if (g.res) {
      panel = `<div class="center">${cardHTML(g.cur, 'lg deal')}</div>
        <div class="verdict ${g.res.ok ? 'ok' : 'ko'}">${g.res.msg}</div>
        ${g.res.extra ? `<p style="margin:0;text-align:center">${g.res.extra}</p>` : ''}
        <button class="btn primary big" data-act="liftNext">Joueur suivant</button>`;
    } else if (g.guess !== null) {
      panel = `${cardHTML('back', 'lg')}
        <div class="hint">${actual > g.guess ? 'Ça monte ▲' : 'Ça descend ▼'}</div>
        <p style="margin:0;text-align:center">Dernier essai, ${esc(player)}. Choisis un autre étage.</p>`;
    } else {
      panel = `${cardHTML('back', 'lg')}
        <p style="margin:0;text-align:center"><b>${esc(dealer)}</b> a tiré une carte. Devine son étage, <b>${esc(player)}</b>.</p>`;
    }
    return `${header('Ascenseur')}
      ${rules([
        'Le donneur tire une carte sans la montrer. Le joueur devine son étage, du 2 (rez-de-chaussée) à l’As (dernier étage).',
        'Raté au premier essai : l’ascenseur indique si ça monte ou si ça descend, et le joueur a un second essai.',
        'Trouvé du premier coup : le donneur boit 4 gorgées. Au second essai : le donneur boit 2 gorgées.',
        'Raté deux fois : le joueur boit l’écart entre son étage et le bon.',
        'Après 3 joueurs ratés d’affilée, le donneur passe la main. Les points sous chaque étage montrent les cartes déjà sorties.'
      ])}
      <div class="stats"><span>Donneur <b>${esc(dealer)}</b></span><span>Ratés d’affilée <b>${g.fails}</b>/3</span></div>
      <div class="turn"><span class="sub">Devine l’étage</span><span class="who">${esc(player)}</span></div>
      <div class="lift">
        <div class="shaft">${floors.join('')}</div>
        <div class="panel" style="align-items:center">${panel}</div>
      </div>`;
  },

  editor() {
    const id = S.editId, R = S.rules[id];
    return `<div class="top">
        <button class="iconbtn" data-act="${S.editBack ? 'backToGame' : 'home'}">← ${S.editBack ? 'Retour au jeu' : 'Jeux'}</button>
        <h2>Mes règles</h2><span></span>
      </div>
      <div class="tabs">${['palmier', 'barbu'].map(t => `<button class="chip pick" data-act="editor" data-arg="${t}" aria-pressed="${t === id}">${t === 'palmier' ? 'Palmier' : 'Barbu'}</button>`).join('')}</div>
      <p class="muted" style="margin:0;font-size:14px">Les changements s’enregistrent tout seuls sur ce téléphone. « Gorgées comptées » ajoute automatiquement des gorgées au compteur de celui qui tire la carte.</p>
      <div class="edit">${Object.entries(R).map(([v, r]) => {
        const c = { v: +v, s: '♠', red: false, sn: 'pique' };
        return `<div class="erow">${cardHTML(c)}
          <div class="fields">
            <input class="t" id="rule-${id}-${v}-t" data-rule="${id}:${v}:t" value="${esc(r.t)}" maxlength="40" aria-label="Nom de la règle du ${NAME(+v)}">
            <textarea id="rule-${id}-${v}-d" data-rule="${id}:${v}:d" maxlength="240" aria-label="Description de la règle du ${NAME(+v)}">${esc(r.d)}</textarea>
            <label class="s">Gorgées comptées <input type="number" min="0" max="20" inputmode="numeric" id="rule-${id}-${v}-s" data-rule="${id}:${v}:sips" value="${r.sips || 0}"></label>
          </div></div>`;
      }).join('')}</div>
      <button class="btn" data-act="resetRules">${S.confirmReset ? 'Confirmer : revenir aux règles d’origine' : 'Revenir aux règles d’origine'}</button>`;
  }
};

function handsHTML(g) {
  return `<div class="section"><span class="label">Les mains</span><div class="hands">${S.players.map(p => `
    <div class="hrow"><span class="n">${esc(p)}</span><div class="hand">${[0, 1, 2, 3].map(i => cardHTML(g.hands[p][i] || null, g.hands[p][i] && g.hands[p][i].used ? 'used' : '')).join('')}</div></div>`).join('')}</div></div>`;
}

function sheetHTML() {
  const max = Math.max(1, ...S.players.map(p => S.sips[p] || 0));
  return `<div class="sheet" data-act="closeSheet"><div class="inner" role="dialog" aria-label="Compteur de gorgées">
    <div class="row spread"><h3 style="font:400 22px/1 var(--display)">Compteur de gorgées</h3><button class="iconbtn" data-act="closeSheet">Fermer</button></div>
    <p class="muted" style="margin:0;font-size:14px">Les gorgées bues sont ajoutées automatiquement. Ajuste à la main pour les gorgées distribuées.</p>
    <div class="tally">${S.players.map((p, i) => {
      const v = S.sips[p] || 0;
      return `<div class="t"><span class="n">${esc(p)}</span>
        <button data-act="sip" data-arg="${i}:-1" aria-label="Retirer une gorgée à ${esc(p)}">−</button>
        <span class="v">${v}</span>
        <button data-act="sip" data-arg="${i}:1" aria-label="Ajouter une gorgée à ${esc(p)}">+</button>
        <div class="bar" style="width:${(v / max) * 100}%"></div></div>`;
    }).join('')}</div>
    <button class="btn" data-act="resetSips">Remettre à zéro</button>
  </div></div>`;
}

// ---------- Rendu ----------
const app = document.getElementById('app');
function render() {
  app.innerHTML = SCREENS[S.screen]() + (S.sheet ? sheetHTML() : '');
  const f = document.getElementById('addForm');
  if (f) f.addEventListener('submit', e => {
    e.preventDefault();
    const inp = document.getElementById('newPlayer');
    const name = inp.value.trim();
    if (!name) return;
    if (S.players.includes(name)) { toast(`${name} est déjà dans la partie`); return; }
    S.players.push(name); save(); render();
    document.getElementById('newPlayer').focus();
  });
}

// ---------- Actions ----------
const A = {
  home() { S.screen = 'home'; S.g = null; render(); window.scrollTo(0, 0); },
  sheet() { S.sheet = true; render(); },
  closeSheet(_, el, e) { if (e.target === el) { S.sheet = false; render(); } },
  sip(arg) {
    const [i, d] = arg.split(':').map(Number), p = S.players[i];
    S.sips[p] = Math.max(0, (S.sips[p] || 0) + d); save(); render();
  },
  resetSips() { S.sips = {}; save(); render(); },
  rmPlayer(i) { S.players.splice(+i, 1); save(); render(); },
  start(id) {
    if (S.players.length < (id === 'autoroute' ? 1 : 2)) { toast('Ajoute au moins deux joueurs'); return; }
    S.screen = id; S.g = INIT[id](); render(); window.scrollTo(0, 0);
  },
  restart() { S.g = INIT[S.screen](); render(); },

  palmDraw() {
    const g = S.g; if (!g.deck.length) return;
    const c = g.deck.splice(Math.floor(Math.random() * g.deck.length), 1)[0];
    g.by = S.players[g.turn % S.players.length];
    g.last = c; g.turn++;
    if (c.v === 13) g.kings++;
    if (S.rules.palmier[c.v].sips) drink(g.by, S.rules.palmier[c.v].sips);
    render();
  },

  rivAnswer(v) {
    const g = S.g, p = S.players[g.pi], hand = g.hands[p];
    const c = draw(g);
    let ok;
    if (g.round === 0) ok = (v === 'rouge') === c.red;
    if (g.round === 1) ok = v === 'plus' ? rank(c) > rank(hand[0]) : rank(c) < rank(hand[0]);
    if (g.round === 2) {
      const lo = Math.min(rank(hand[0]), rank(hand[1])), hi = Math.max(rank(hand[0]), rank(hand[1])), r = rank(c);
      ok = v === 'in' ? r > lo && r < hi : r < lo || r > hi;
    }
    if (g.round === 3) ok = v === c.s;
    hand.push(c);
    g.res = { ok };
    if (!ok) drink(p, g.round + 1);
    render();
  },
  rivNext() {
    const g = S.g; g.res = null;
    g.round++;
    if (g.round > 3) { g.round = 0; g.pi++; }
    if (g.pi >= S.players.length) { g.phase = 'river'; g.round = 3; g.river = Array.from({ length: 10 }, () => draw(g)); }
    render(); window.scrollTo(0, 0);
  },
  rivFlip() {
    const g = S.g; g.k++;
    const c = g.river[g.k], sips = Math.floor(g.k / 2) + 1, give = g.k % 2 === 1;
    const lines = [];
    S.players.forEach(p => {
      g.hands[p].forEach(h => {
        if (!h.used && h.v === c.v) {
          h.used = true;
          if (!give) drink(p, sips);
          lines.push(`<b>${esc(p)}</b> a un ${NAME(c.v)} : ${give ? 'donne' : 'boit'} ${plural(sips, 'gorgée')}`);
        }
      });
    });
    g.lines = lines.length ? lines : [`${NAME(c.v)} ${c.s} : personne n’a cette carte.`];
    render();
  },
  toRoad(name) { S.screen = 'autoroute'; S.g = INIT.autoroute(name); render(); window.scrollTo(0, 0); },

  purpleGuess(v) {
    const g = S.g, who = S.players[g.turn % S.players.length];
    const cards = v === 'purple' ? [draw(g), draw(g)] : [draw(g)];
    const ok = v === 'purple' ? cards[0].red !== cards[1].red : (v === 'rouge') === cards[0].red;
    if (ok) { g.pile += cards.length; g.streak++; g.last = { cards, ok, who }; }
    else {
      const sips = g.pile + cards.length;
      drink(who, sips);
      g.last = { cards, ok, who, sips };
      g.pile = 0; g.streak = 0; g.turn++;
    }
    render();
  },
  purplePass() { const g = S.g; g.turn++; g.streak = 0; g.last = null; render(); },

  roadDriver(name) { S.g = INIT.autoroute(name); render(); },
  roadGuess(v) {
    const g = S.g, cur = g.slots[g.pos], c = draw(g);
    const ok = v === 'plus' ? rank(c) > rank(cur) : rank(c) < rank(cur);
    if (ok) {
      g.pos++; g.slots[g.pos] = c;
      if (g.pos === g.len - 1) g.done = true;
    } else {
      const sips = g.pos + 1;
      g.total += sips; drink(g.driver, sips);
      g.crash = { card: c, sips, tie: rank(c) === rank(cur) };
    }
    render();
  },
  roadRetry() {
    const g = S.g; g.crash = null; g.tries++;
    g.slots = Array(g.len).fill(null); g.slots[0] = draw(g); g.pos = 0;
    render();
  },
  roadNew() { S.g = INIT.autoroute(S.g.driver); render(); },

  barbuDraw() {
    const g = S.g; if (!g.deck.length) return;
    const c = g.deck.pop();
    g.by = S.players[g.turn % S.players.length];
    g.last = c; g.turn++;
    if (S.rules.barbu[c.v].sips) drink(g.by, S.rules.barbu[c.v].sips);
    render();
  },

  pyrFlip() { const g = S.g; g.k++; g.check = false; render(); },
  pyrCheck() { S.g.check = true; render(); },
  pyrShow() {
    const g = S.g; g.showing = true; g.left = MEMO_SECONDS;
    clearInterval(memoTimer);
    memoTimer = setInterval(() => {
      if (S.screen !== 'pyramide' || S.g !== g || !g.showing) { clearInterval(memoTimer); return; }
      g.left--;
      const el = document.getElementById('memoLeft');
      if (el) el.textContent = g.left + ' s';
      if (g.left <= 0) A.pyrHide();
    }, 1000);
    render();
  },
  pyrHide() {
    const g = S.g; clearInterval(memoTimer);
    g.showing = false; g.mi++;
    if (g.mi >= S.players.length) g.phase = 'play';
    render(); window.scrollTo(0, 0);
  },

  liftGuess(arg) {
    const g = S.g, r = +arg, actual = rank(g.cur), P = S.players;
    const dealer = P[g.dealer % P.length], player = P[g.player % P.length];
    const second = g.guess !== null;
    if (r === actual) {
      const n = second ? 2 : 4;
      drink(dealer, n); g.fails = 0;
      g.res = { ok: true, msg: `${second ? 'Trouvé au second essai' : 'Dans le mille'} ! ${esc(dealer)} boit ${plural(n, 'gorgée')}.` };
    } else if (!second) {
      g.guess = r; render(); return;
    } else {
      const n = Math.abs(r - actual);
      drink(player, n); g.fails++;
      g.res = { ok: false, msg: `Raté ! ${esc(player)} boit ${plural(n, 'gorgée')} (écart de ${n} étage${n > 1 ? 's' : ''}).` };
      if (g.fails >= 3) {
        g.dealer = (g.dealer + 1) % P.length; g.fails = 0;
        g.res.extra = `3 ratés d’affilée : <b>${esc(P[g.dealer])}</b> devient le donneur.`;
      }
    }
    g.guess = r;
    g.seen[actual] = (g.seen[actual] || 0) + 1;
    render();
  },
  liftNext() {
    const g = S.g, n = S.players.length;
    g.player = (g.player + 1) % n;
    if (g.player === g.dealer % n) g.player = (g.player + 1) % n;
    if (!g.deck.length) g.seen = {};
    g.cur = draw(g); g.guess = null; g.res = null;
    render();
  },

  editor(id) {
    if (S.screen !== 'editor') S.editBack = S.screen === 'home' ? null : S.screen;
    S.editId = id; S.screen = 'editor'; S.confirmReset = false;
    render(); window.scrollTo(0, 0);
  },
  backToGame() { S.screen = S.editBack; S.editBack = null; render(); window.scrollTo(0, 0); },
  resetRules() {
    if (!S.confirmReset) { S.confirmReset = true; render(); return; }
    S.rules[S.editId] = clone(DEFAULT_RULES[S.editId]);
    store.set('rules:' + S.editId, S.rules[S.editId]);
    S.confirmReset = false; render(); toast('Règles d’origine rétablies');
  }
};

app.addEventListener('input', e => {
  const f = e.target.dataset.rule; if (!f) return;
  const [id, v, k] = f.split(':');
  S.rules[id][v][k] = k === 'sips' ? Math.max(0, Math.min(20, parseInt(e.target.value, 10) || 0)) : e.target.value;
  store.set('rules:' + id, S.rules[id]);
});

let wake = false;
document.addEventListener('click', e => {
  if (!wake && navigator.wakeLock) { wake = true; navigator.wakeLock.request('screen').catch(() => {}); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset.arg, el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = false; render(); } });

render();
</script>
